[mypy]
# 严格类型检查配置。项目使用 # type: 注释（兼容 Python 3.8），
# 而非原生语法标注，故 check_untyped_defs 需关闭（否则所有未标注函数
# 都报错）。核心检查项：
#   - disallow_untyped_calls: 禁止调用未标注类型的函数
#   - warn_unused_ignores:    无用的 # type: ignore 视为错误
#   - warn_redundant_casts:   冗余 cast 视为错误
python_version = 3.8
check_untyped_defs = False
disallow_untyped_calls = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
ignore_missing_imports = True

# tkinter / PIL 等第三方库无类型存根，忽略缺失导入
[[mypy-tkinter.*]]
ignore_missing_imports = True

[[mypy-PIL.*]]
ignore_missing_imports = True

[[mypy-xxhash]]
ignore_missing_imports = True

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 测试 (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 编译检查（全部模块，含 type-comment 语法校验）
        run: python -m py_compile main.py config.py scheduler.py scanner.py sync_engine.py logger.py gui_app.py gui_diff.py gui_task_dialog.py utils/paths.py utils/timeutil.py build_exe.py make_icon.py

      - name: 运行无头自测（24 节 143 项断言）
        run: python test_sync.py

  mypy:
    name: 类型检查 (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 安装 mypy
        run: pip install mypy

      - name: mypy 严格类型检查
        run: mypy --config-file mypy.ini main.py config.py scheduler.py scanner.py sync_engine.py logger.py gui_task_dialog.py gui_diff.py utils/paths.py utils/timeutil.py
        continue-on-error: true  # 本地无 pip 环境无法预验证，先允许失败，验证通过后移除
